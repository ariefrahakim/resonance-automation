name: Resonance Automation Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Select which tests to run'
        required: true
        default: 'both'
        type: choice
        options:
          - api
          - web
          - both

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_type == 'api' ||
      github.event.inputs.test_type == 'both'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run API tests (Bearer token auth)
        run: ./gradlew clean apiTest --info

      - name: Upload TestNG HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-testng-report-${{ github.run_number }}
          path: build/reports/tests/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-allure-results-${{ github.run_number }}
          path: build/allure-results/
          retention-days: 30

  web-tests:
    name: Web Tests (Cucumber/Gherkin + Screenshots)
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_type == 'web' ||
      github.event.inputs.test_type == 'both'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Google Chrome (stable)
        uses: browser-actions/setup-chrome@v1

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run Web tests (headless Cucumber/Gherkin)
        run: ./gradlew clean webTest --info

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-failure-screenshots-${{ github.run_number }}
          path: build/screenshots/
          retention-days: 30

      - name: Upload Cucumber HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-cucumber-report-${{ github.run_number }}
          path: build/reports/
          retention-days: 30

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-allure-results-${{ github.run_number }}
          path: build/allure-results/
          retention-days: 30

  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [ api-tests, web-tests ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API Allure results
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results-${{ github.run_number }}
          path: allure-results/api
        continue-on-error: true

      - name: Download Web Allure results
        uses: actions/download-artifact@v4
        with:
          name: web-allure-results-${{ github.run_number }}
          path: allure-results/web
        continue-on-error: true

      - name: Merge Allure results
        run: |
          mkdir -p allure-results/merged
          cp -r allure-results/api/. allure-results/merged/ 2>/dev/null || true
          cp -r allure-results/web/. allure-results/merged/ 2>/dev/null || true

      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure HTML report
        run: allure generate allure-results/merged -o allure-report --clean

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
